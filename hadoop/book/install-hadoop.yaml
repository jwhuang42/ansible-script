---
- name: Install Hadoop Package
  hosts: newborn
  gather_facts: true
  gather_subset:
    - distribution
    - '!all'
    - '!min'
  any_errors_fatal: true

  vars:
    install_from_remote: false
    install_hbase: false
    local_repo: '../repo/hadoop'
    remote_repo: '~/repo/hadoop'
    # NOTE: Change the `src` below to correct package in `local_repo` if install via local package.
    package_info:
      - {src: 'openlogic-openjdk-17.0.9+9-linux-x64.tar.gz', dst: 'java/jdk-17.0.9+9', home: 'jdk17', link: 'https://builds.openlogic.com/downloadJDK/openlogic-openjdk/17.0.9+9/openlogic-openjdk-17.0.9+9-linux-x64.tar.gz'}
      - {src: 'openlogic-openjdk-8u392-b08-linux-x64.tar.gz', dst: 'java/jdk8u392-b08', home: 'jdk8', link: 'https://builds.openlogic.com/downloadJDK/openlogic-openjdk/8u392-b08/openlogic-openjdk-8u392-b08-linux-x64.tar.gz'}
      - {src: 'apache-zookeeper-3.8.3-bin.tar.gz', dst: 'apache/zookeeper-3.8.3', home: 'zookeeper', link: 'https://archive.apache.org/dist/zookeeper/zookeeper-3.8.3/apache-zookeeper-3.8.3-bin.tar.gz'}
      - {src: 'hbase-2.4.17-bin.tar.gz', dst: 'apache/hbase-2.4.17',home: 'hbase', link: 'https://archive.apache.org/dist/hbase/2.4.17/hbase-2.4.17-bin.tar.gz'}
      - {src: 'hadoop-3.3.6.tar.gz', dst: 'apache/hadoop-3.3.6', home: 'hadoop', link: 'https://archive.apache.org/dist/hadoop/core/hadoop-3.3.6/hadoop-3.3.6.tar.gz'}
      - { src: 'spark-3.4.2-bin-hadoop3.tgz', dst: 'apache/spark-3.4.2', home: 'spark', link: 'https://archive.apache.org/dist/spark/spark-3.4.2/spark-3.4.2-bin-hadoop3.tgz' }

  tasks:

    - name: test connectivity
      ping:

    - name: copy or download hadoop package
      block:
        - name: copy package from local repo
          copy:
            src: '{{ local_repo }}'
            dest: '~/repo'
          when: not install_from_remote

        - name: Copy the download script to the remote machine
          copy:
            src: '../repo/download_util.sh'
            dest: /tmp/download_util.sh
            mode: '0755'
          when: install_from_remote

        - name: Download packages using the custom script
          command: /tmp/download_util.sh "{{ item.link }}" "{{ remote_repo }}"
          with_items: "{{ package_info }}"
          when: install_from_remote

    - name: prepare directory
      become: true
      file:
        state: directory
        path: '{{ deploy_dir }}/{{ item.dst }}'
        owner: '{{ ansible_user }}'
        group: '{{ ansible_user }}'
        mode: 0775
        recurse: yes
      with_items: '{{ package_info }}'

    - name: create link
      become: true
      file:
        state: link
        src: '{{ deploy_dir }}/{{ item.dst }}'
        dest: '{{ deploy_dir }}/{{ item.home }}'
        owner: '{{ ansible_user }}'
        group: '{{ ansible_user }}'
      with_items: '{{ package_info }}'

    - name: install package
      unarchive:
        src: '{{ remote_repo }}/{{ item.src }}'
        dest: '{{ deploy_dir }}/{{ item.dst }}'
        remote_src: yes
        extra_opts:
          - --strip-components=1
      with_items: '{{ package_info }}'

    - name: config /etc/profile
      become: true
      blockinfile:
        dest: '/etc/profile'
        marker: "# {mark} ANSIBLE MANAGED PROFILE"
        block: |
          export JAVA_HOME={{ deploy_dir }}/jdk8
          export HADOOP_HOME={{ deploy_dir }}/hadoop
          export HBASE_HOME={{ deploy_dir }}/hbase
          export SPARK_HOME={{ deploy_dir }}/spark
          export PATH=$JAVA_HOME/bin:$HADOOP_HOME/bin:$HADOOP_HOME/sbin:$HBASE_HOME/bin:$SPARK_HOME/bin:$PATH

    - name: config zkEnv.sh
      lineinfile:
        path: '{{ deploy_dir }}/zookeeper/bin/zkEnv.sh'
        line: 'JAVA_HOME={{ deploy_dir }}/jdk17'
        insertafter: '^#\!\/usr\/bin'
        firstmatch: yes

    - name: config hadoop-env.sh
      blockinfile:
        dest: '{{ deploy_dir }}/hadoop/etc/hadoop/hadoop-env.sh'
        marker: "# {mark} ANSIBLE MANAGED DEFAULT HADOOP ENV"
        block: |
          export JAVA_HOME={{ deploy_dir }}/jdk8

    - name: config hbase-env.sh
      blockinfile:
        dest: '{{ deploy_dir }}/hbase/conf/hbase-env.sh'
        marker: "# {mark} ANSIBLE MANAGED DEFAULT HBASE ENV"
        block: |
          export JAVA_HOME={{ deploy_dir }}/jdk17
          export HBASE_MANAGES_ZK=false
          export HBASE_LIBRARY_PATH={{ deploy_dir }}/hadoop/lib/native
          export HBASE_OPTS="$HBASE_OPTS --add-exports=java.base/jdk.internal.access=ALL-UNNAMED --add-exports=java.base/jdk.internal=ALL-UNNAMED --add-exports=java.base/jdk.internal.misc=ALL-UNNAMED --add-exports=java.base/sun.security.pkcs=ALL-UNNAMED --add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.lang.reflect=ALL-UNNAMED --add-opens java.base/java.io=ALL-UNNAMED --add-opens java.base/java.nio=ALL-UNNAMED --add-opens java.base/jdk.internal=ALL-UNNAMED --add-opens java.base/jdk.internal.misc=ALL-UNNAMED --add-opens java.base/jdk.internal.access=ALL-UNNAMED"

    - name: Create or overwrite spark-env.sh with desired environment variables
      copy:
        dest: "{{ deploy_dir }}/spark/conf/spark-env.sh"
        content: |
          export JAVA_HOME={{ deploy_dir }}/jdk8
          export HADOOP_CONF_DIR={{ deploy_dir }}/hadoop/etc/hadoop
          export YARN_CONF_DIR={{ deploy_dir }}/hadoop/etc/hadoop
        mode: '0755'

    - name: link hadoop config
      file:
        state: link
        src: '{{ deploy_dir }}/hadoop/etc/hadoop/{{ item }}'
        dest: '{{ deploy_dir }}/hbase/conf/{{ item }}'
      with_items:
        - core-site.xml
        - hdfs-site.xml

    - name: Display Distribution
      debug: msg="The distribution of current machine is '{{ ansible_distribution }}'"

    - name: Install EPEL Repository (CentOS)
      become: true
      yum:
        name: epel-release
        state: present
      when: ansible_distribution == "CentOS"

    - name: Update yum cache (CentOS)
      become: true
      yum:
        name: '*'
        state: latest
      when: ansible_distribution == "CentOS"

    - name: Install libraries (CentOS)
      become: true
      yum:
        name:
          - snappy
          - snappy-devel
          - lz4
          - lz4-devel
          - libzstd
          - libzstd-devel
        state: present
      when: ansible_distribution == "CentOS"

    - name: Update apt cache (Ubuntu)
      become: true
      apt:
        update_cache: yes
      when: ansible_distribution == "Ubuntu"

    - name: Install libraries (Ubuntu)
      become: true
      apt:
        name:
          - libsnappy1v5
          - libsnappy-dev
          - liblz4-1
          - liblz4-dev
          - libzstd1
          - libzstd-dev
        state: present
      when: ansible_distribution == "Ubuntu"

    - name: check hadoop native
      shell: '{{ deploy_dir }}/hadoop/bin/hadoop checknative -a'
      register: hadoop_checknative
      failed_when: false
      changed_when: false
      ignore_errors: yes
      environment:
        JAVA_HOME: '{{ deploy_dir }}/jdk8'

    - name: hadoop native status
      debug:
        msg: "{{ hadoop_checknative.stdout_lines }}"

    - name: check hbase native
      shell: '{{ deploy_dir }}/hbase/bin/hbase --config ~/conf_hbase org.apache.hadoop.util.NativeLibraryChecker'
      register: hbase_checknative
      failed_when: false
      changed_when: false
      ignore_errors: yes
      environment:
        JAVA_HOME: '{{ deploy_dir }}/jdk17'
        HBASE_LIBRARY_PATH: '{{ deploy_dir }}/hadoop/lib/native'
        LD_LIBRARY_PATH: '{{ deploy_dir }}/hadoop/lib/native'
      when: install_hbase

    - name: hbase native status
      debug:
        msg: "{{ hbase_checknative.stdout_lines|select('match', '^[^0-9]') | list }}"
      when: install_hbase

    - name: test native compresssion
      shell: '{{ deploy_dir }}/hbase/bin/hbase org.apache.hadoop.hbase.util.CompressionTest file:///tmp/test {{ item }}'
      register: 'compression'
      failed_when: false
      changed_when: false
      ignore_errors: yes
      environment:
        JAVA_HOME: '{{ deploy_dir }}/jdk17'
        HBASE_LIBRARY_PATH: '{{ deploy_dir }}/hadoop/lib/native'
        LD_LIBRARY_PATH: '{{ deploy_dir }}/hadoop/lib/native'
      with_items:
        - snappy
        - lz4
      when: install_hbase

    - name: native compresssion status
      vars:
        results: "{{ compression | json_query('results[*].{type:item, result:stdout}') }}"
      debug:
        msg: |
          {% for r in results %} {{ r.type }} => {{ r.result == 'SUCCESS' }} {% endfor %}
      when: install_hbase
